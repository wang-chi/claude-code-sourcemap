name: mycoder

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  mycoder:
    if: |
      contains(github.event.comment.body, ' /mycoder') ||
      startsWith(github.event.comment.body, '/mycoder')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run mycoder
        uses: ASUSOCIS/mycoder-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYCODER_AFS_API_KEY: ${{ secrets.MYCODER_AFS_API_KEY }}
          MYCODER_AFS_API_URL: ${{ secrets.MYCODER_AFS_API_URL }}
        with:
          model: ${{ secrets.MYCODER_MODEL }}
          use_github_token: true